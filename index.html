<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0B1A1D" media="(prefers-color-scheme: dark)"/>
<meta name="color-scheme" content="light dark"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Speak Daily</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap"/>
<style>
/* Mobile first. One column, a tab bar under the thumb, and a single bold element: the drive card.
   Motion: press (scale .97, 120ms), tab marker and sheet (under 250ms), score ring and pace pin
   (once, 420ms), listening wave (only while the mic is open). Reduced motion turns all of it off. */
:root{
  --out:cubic-bezier(.23,1,.32,1);
  --bg:#EEF3F1; --surface:#FFFFFF; --inset:#E3ECE9; --ink:#10282B; --ink-2:#4B6366; --line:#D2DEDB;
  --sign:#0F6B4F; --on-sign:#FFFFFF;
  --good:#17805A; --good-soft:#D5EBE1; --warn:#9A5F06; --warn-soft:#FBEBC8; --bad:#C2412D; --bad-soft:#F8DAD3;
  --amber:#E9A21A;
  --dim:var(--ink-2); --txt:var(--ink); --accent:var(--sign); --card:var(--surface); --card2:var(--inset);
  --display:"Bricolage Grotesque","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1A1D; --surface:#12272B; --inset:#0E2125; --ink:#E6F1EE; --ink-2:#9DB7B3; --line:#1F3A3F;
    --sign:#3DBE92; --on-sign:#04231A;
    --good:#4FD1A1; --good-soft:#143A31; --warn:#F2B84B; --warn-soft:#3A2D0F; --bad:#FF8C78; --bad-soft:#40201B;
    --amber:#F2B84B;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,textarea,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
p{margin:0}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.mark{width:26px;height:26px;fill:var(--sign)}
.hud{display:flex;gap:8px}
.hud span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-weight:800}
.hud svg{width:16px;height:16px}

/* page */
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:6px max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main>section{display:flex;flex-direction:column;gap:16px}
main>section.enter{animation:fade .14s var(--out)}

/* the drive card: the one bold thing on the page */
.drive{position:relative;overflow:hidden;display:block;width:100%;min-height:132px;text-align:left;border:0;border-radius:24px;padding:20px;
  background:var(--sign);color:var(--on-sign);transition:transform .12s var(--out)}
.drive:active{transform:scale(.98)}
.drive .t{display:block;max-width:calc(100% - 88px);font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.01em}
.drive .s{display:block;max-width:calc(100% - 88px);margin-top:10px;font-size:15px;line-height:1.4;opacity:.92}
.drive .bars{position:absolute;right:20px;bottom:20px;display:flex;align-items:flex-end;gap:5px;height:70px}
.drive .bars i{display:block;width:7px;height:calc(var(--h) * 100%);border-radius:4px;background:currentColor;opacity:.92;
  transform-origin:bottom;animation:rise .42s var(--out) both;animation-delay:calc(var(--n) * 50ms)}

/* cards */
.card{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card:has(>#topicChips,>#lvChips,>#sc,>#cc){background:none;border:0;padding:0;gap:10px}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink-2)}
.card:has(>#topicChips,>#lvChips,>#sc,>#cc) h3{font-size:14px}
.sentence{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sentence.small{font-size:22px}
.muted{color:var(--ink-2);font-size:14px;line-height:1.5}

/* chips and the level switch */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;transition:transform .12s var(--out),background-color .15s,border-color .15s}
.chip:active{transform:scale(.97)}
.chip.active{background:var(--sign);border-color:var(--sign);color:var(--on-sign)}
span.chip{min-height:34px;padding:0 12px;font-size:14px;font-weight:700;pointer-events:none}
#lvChips{display:grid;grid-template-columns:repeat(3,1fr)}

/* buttons */
.act{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 18px;border-radius:16px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:17px;
  transition:transform .12s var(--out),background-color .15s,border-color .15s}
.act svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act:active{transform:scale(.97)}
.act.primary{background:var(--sign);border-color:var(--sign);color:var(--on-sign)}
.act.ghost{background:transparent}
.act.danger{color:var(--bad);border-color:var(--bad-soft)}
.act:disabled{opacity:.45}
@media (hover:hover){.act:hover{border-color:var(--sign)}.chip:hover{border-color:var(--sign)}}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

textarea,#sheetIn{width:100%;border-radius:14px;border:1.5px solid transparent;background:var(--inset);font-size:17px;line-height:1.45}
textarea{min-height:96px;padding:14px;resize:vertical}
#sheetIn{min-height:52px;padding:0 14px}
textarea::placeholder,#sheetIn::placeholder{color:var(--ink-2);opacity:.85}
textarea:focus-visible,#sheetIn:focus-visible{outline:none;border-color:var(--sign)}

/* feedback */
#fb:empty,#stFb:empty,#chFb:empty{display:none}
#fb>div,#stFb>div,#chFb>div{display:flex;flex-direction:column;gap:14px;margin-top:0!important;animation:lift .2s var(--out)}
.scorehead{display:flex;align-items:center;gap:16px}
.scorehead .lbl{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.ring{--tone:var(--sign);position:relative;width:92px;height:92px;flex:none}
.ring[data-tone=good]{--tone:var(--good)}.ring[data-tone=warn]{--tone:var(--warn)}.ring[data-tone=bad]{--tone:var(--bad)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--inset);stroke-width:3.4}
.ring .val{fill:none;stroke:var(--tone);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--v));animation:draw .42s var(--out) both}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.pace{--tone:var(--good);display:flex;flex-direction:column;gap:7px}
.pace[data-tone=warn]{--tone:var(--warn)}
.paceTrack{position:relative;height:10px;border-radius:99px;background:var(--inset)}
.paceTrack .zone{position:absolute;top:0;bottom:0;left:50%;width:18.18%;border-radius:99px;background:var(--good);opacity:.3}
.paceTrack .pin{position:absolute;top:-5px;left:var(--p);width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--tone);animation:pin .42s var(--out) both}
.paceLegend{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--sign);transform-origin:left;animation:grow .42s var(--out) both}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.skill .lab{display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px;font-weight:700;color:var(--ink-2)}
.skill .lab b{color:var(--ink)}
.miss{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:15px}
.tip{padding:12px 14px;border-radius:14px;background:var(--inset);font-size:15px;line-height:1.5}
.tip.bad{background:var(--bad-soft)}.tip.good{background:var(--good-soft)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border-bottom:0}
.hist .b{font-family:var(--display);font-weight:800;font-size:20px}
canvas{display:block;width:100%;height:150px}

/* bottom tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:0;background:none;color:var(--ink-2);
  font-size:12.5px;font-weight:700;transition:color .15s,transform .12s var(--out)}
#tabs button:active{transform:scale(.96)}
#tabs button.active{color:var(--sign)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs .ind{position:absolute;top:-1px;left:0;width:25%;height:3px;pointer-events:none;transform:translateX(calc(var(--i,0) * 100%));transition:transform .24s var(--out)}
#tabs .ind::after{content:"";display:block;width:34px;height:3px;margin:0 auto;border-radius:0 0 3px 3px;background:var(--sign)}

/* hands-free screen: dark and quiet on purpose */
#hf{--sign:#3DBE92;position:fixed;inset:0;z-index:99;display:none;flex-direction:column;gap:20px;color:#E6F1EE;background:#0B1A1D;
  padding:calc(24px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
#hf.on{display:flex;animation:fade .18s var(--out)}
#hfStatus{font-size:15px;font-weight:700;color:#9DB7B3}
#hfMain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
#hfText{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2;text-wrap:balance}
#hfHeard{min-height:56px;font-size:19px;color:#9DB7B3}
#hfScore{font-family:var(--display);font-weight:800;font-size:64px;line-height:1}
.hfLabel{margin-top:6px;font-size:18px;font-weight:700;color:#9DB7B3}
.wave{display:flex;align-items:center;justify-content:center;gap:7px;height:64px}
.wave i{display:block;width:7px;height:64px;border-radius:4px;background:var(--sign);transform:scaleY(.2)}
#hf.listening .wave i{animation:wave 1s ease-in-out infinite;animation-delay:calc(var(--n) * 80ms)}
.hfHint{text-align:center;font-size:15px;color:#9DB7B3}
#hfStop{min-height:64px;border-radius:18px;border:2px solid #FF8C78;background:transparent;color:#FF8C78;font-size:20px;font-weight:800;touch-action:manipulation;transition:transform .12s var(--out)}
#hfStop:active{transform:scale(.97)}

/* in-page dialog (the phone's own pop-ups are blocked in many viewers) */
.sheet{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,24,26,.55);animation:fade .18s var(--out)}
.sheet .panel{position:relative;display:flex;flex-direction:column;gap:16px;width:100%;max-width:520px;padding:20px;border-radius:24px;background:var(--surface);animation:pop .2s var(--out)}
.sheet p{font-size:18px;line-height:1.45}

@keyframes fade{from{opacity:0}}
@keyframes lift{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(.15)}}
@keyframes draw{from{stroke-dashoffset:100}}
@keyframes pin{from{left:0}}
@keyframes wave{50%{transform:scaleY(var(--h))}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wave i{transform:scaleY(var(--h))}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="3.4" height="6" rx="1.7"/><rect x="7.5" y="4.5" width="3.4" height="15" rx="1.7"/><rect x="13" y="2" width="3.4" height="20" rx="1.7"/><rect x="18.5" y="7" width="3.4" height="10" rx="1.7"/></svg>
    <span>Speak Daily</span>
  </div>
  <div class="hud" role="group" aria-label="Streak and points">
    <span title="Days in a row"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--amber)" d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg><b id="streak">0</b></span>
    <span title="Points"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--sign)" d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg><b id="xp">0</b> XP</span>
  </div>
</header>

<main>
  <button id="hfToggle" class="drive" type="button">
    <span class="t">Start drive session</span>
    <span class="s">4 sentences, 2 questions and a story. Voice only.</span>
    <span class="bars" aria-hidden="true"><i style="--h:.4;--n:0"></i><i style="--h:.75;--n:1"></i><i style="--h:.55;--n:2"></i><i style="--h:1;--n:3"></i><i style="--h:.65;--n:4"></i><i style="--h:.35;--n:5"></i></span>
  </button>
  <section id="tab-lessons"></section>
  <section id="tab-story" hidden></section>
  <section id="tab-chat" hidden></section>
  <section id="tab-progress" hidden></section>
</main>

<nav id="tabs" aria-label="Sections">
  <button data-tab="lessons" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v15h5.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg><span>Lessons</span></button>
  <button data-tab="story"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg><span>Stories</span></button>
  <button data-tab="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Chat</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg><span>Progress</span></button>
  <i class="ind"></i>
</nav>

<div id="hf" role="dialog" aria-label="Hands-free session">
  <div id="hfStatus">Getting ready</div>
  <div id="hfMain">
    <div id="hfText"></div>
    <div id="hfHeard"></div>
    <div id="hfScore"></div>
  </div>
  <div class="wave" aria-hidden="true"><i style="--h:.55;--n:0"></i><i style="--h:.9;--n:1"></i><i style="--h:.7;--n:2"></i><i style="--h:1;--n:3"></i><i style="--h:.75;--n:4"></i><i style="--h:.95;--n:5"></i><i style="--h:.6;--n:6"></i></div>
  <div class="hfHint">Say repeat, next, slower or stop</div>
  <button id="hfStop" type="button">Stop</button>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetMsg">
    <p id="sheetMsg"></p>
    <input id="sheetIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" hidden/>
    <div class="row">
      <button class="act ghost" id="sheetNo" type="button">Cancel</button>
      <button class="act primary" id="sheetOk" type="button">OK</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. STORAGE
   ============================================================ */
const KEY = 'speakDaily.v2';
let S = load();

function fresh(){ return { xp:0, streak:0, lastDay:null, history:[], checkups:[], driveN:0, settings:{ rate:0.95, silence:2.5 } }; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(fresh(), JSON.parse(raw));
  }catch(e){}
  return fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function dayStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return dayStr(new Date()); }

function bumpStreak(){
  const t = todayStr();
  if(S.lastDay === t) return;
  const y = dayStr(new Date(Date.now()-864e5));
  S.streak = (S.lastDay === y) ? (S.streak||0)+1 : 1;
  S.lastDay = t;
  save(); renderHud();
}
function renderHud(){
  document.getElementById('xp').textContent = S.xp;
  document.getElementById('streak').textContent = S.streak;
}

/* ============================================================
   2. TEXT UTILITIES
   ============================================================ */
function words(s){ return String(s||'').trim().split(/\s+/).filter(Boolean); }
function norm(w){ return w.toLowerCase().replace(/[^a-z0-9']/g,''); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* longest common subsequence with backtracking (for missed words) */
function lcsMatch(a,b){
  const n=a.length, m=b.length;
  const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      dp[i][j] = (a[i-1]===b[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const mT = new Array(n).fill(false);
  let i=n, j=m;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ mT[i-1]=true; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return { len: dp[n][m], matchedTarget: mT };
}

const FILLERS = ['um','uh','erm','ah','hmm'];  // real words such as "like" are not fillers
function countFillers(raw){
  const w = words(raw.toLowerCase()).map(x=>x.replace(/[^a-z]/g,''));
  let c = 0;
  for(const x of w) if(FILLERS.includes(x)) c++;
  if(/\byou know\b/i.test(raw)) c++;
  if(/\bi mean\b/i.test(raw)) c++;
  return c;
}

const GRAMMAR_RULES = [
  [/\bi am agree\b/gi, 'I agree'],
  [/\bmore better\b/gi, 'better'],
  [/\bmore easier\b/gi, 'easier'],
  [/\bhe go\b/gi, 'he goes'],
  [/\bshe go\b/gi, 'she goes'],
  [/\bit go\b/gi, 'it goes'],
  [/\bi has\b/gi, 'I have'],
  [/\bhe don't\b/gi, "he doesn't"],
  [/\bshe don't\b/gi, "she doesn't"],
  [/\bwe was\b/gi, 'we were'],
  [/\bthey was\b/gi, 'they were'],
  [/\bpeople is\b/gi, 'people are'],
  [/\bdidn't went\b/gi, "didn't go"],
  [/\bdidn't knew\b/gi, "didn't know"],
  [/\bi didn't went\b/gi, "I didn't go"],
  [/\bexplain me\b/gi, 'explain to me'],
  [/\bdiscuss about\b/gi, 'discuss'],
  [/\bi very like\b/gi, 'I really like'],
  [/\bhow much years\b/gi, 'how many years'],
  [/\bi am living here since\b/gi, 'I have been living here since'],
  [/\byesterday i go\b/gi, 'yesterday I went'],
  [/\bcan you borrow me\b/gi, 'can you lend me'],
  [/\bi am boring\b/gi, 'I am bored'],
  [/\bhe is more tall\b/gi, 'he is taller'],
  [/\ba (?!uni|use|usu|uti|eur|one|ubi)([aeiou]\w*)/g, 'an $1']
];

function checkGrammar(text){
  let fixed = text, hits = [];
  for(const [re, rep] of GRAMMAR_RULES){
    if(re.test(fixed)){
      const was = fixed.match(re)[0];
      hits.push({ was, fix: was.replace(new RegExp(re.source, re.flags.replace('g','')), rep) });
      fixed = fixed.replace(re, rep);
    }
    re.lastIndex = 0;
  }
  // crude repeated-word check
  const rep = fixed.match(/\b(\w+)\s+\1\b/gi);
  if(rep) hits.push({ was: rep[0], fix: rep[0].split(/\s+/)[0] });
  return { fixed, hits };
}

function uniqueWordRatio(w){
  if(!w.length) return 0;
  return new Set(w).size / w.length;
}

/* ============================================================
   3. SCORING ENGINE
   ============================================================ */
function fluencyScore(wpm, fillers, wc){
  let s = 10;
  if(wpm < 50) s -= 4.5;
  else if(wpm < 75) s -= 2.5;
  else if(wpm < 95) s -= 1;
  else if(wpm <= 165) s -= 0;
  else if(wpm <= 195) s -= 1.5;
  else s -= 3;
  s -= Math.min(4, fillers * 0.9);
  if(wc < 4) s -= 3;
  return clamp(s, 0, 10);
}

function vocabScore(w){
  if(!w.length) return 0;
  const ttr = uniqueWordRatio(w);
  const avgLen = w.reduce((a,x)=>a+x.length,0)/w.length;
  let s = 3 + ttr*6 + Math.min(2.5, (avgLen-3.8)*1.2);
  if(w.length < 8) s = Math.min(s, 6);
  if(w.length < 4) s = Math.min(s, 3.5);
  return clamp(s, 0, 10);
}

function grammarScore(hits, wc){
  let s = 10 - hits.length * 2;
  if(wc < 4) s -= 1;
  return clamp(s, 0, 10);
}

/* A story needs four parts. Each part is found by simple signal words (whole words only). */
const STAGES = [
  ['Beginning', ['one day','yesterday','last week','last month','last year','once','when i was']],
  ['Problem',   ['but','suddenly','however','problem','unfortunately','unexpectedly','went wrong']],
  ['Action',    ['then','after that','next','so i','i decided','i tried','because']],
  ['Ending',    ['finally','in the end','at last','that is why','i learned','at the end']]
];
function storyStages(text){
  const t = text.toLowerCase();
  return STAGES.map(([name, ms]) => [name, ms.some(m => new RegExp('\\b'+m+'\\b').test(t))]);
}
function structureScore(text){
  const t = text.toLowerCase();
  const hit = storyStages(text).filter(x => x[1]).length;
  const past = (t.match(/\b\w+ed\b/g)||[]).length;
  const wc = words(text).length;
  let s = 2 + hit * 1.8 + Math.min(1.5, past * 0.3);
  if(wc < 25) s = Math.min(s, 4);
  else if(wc < 50) s = Math.min(s, 6);
  else if(wc > 160) s = Math.min(s, 9.5);
  return clamp(s, 0, 10);
}

function bandLabel(b){
  if(b >= 8.5) return 'Excellent';
  if(b >= 7.5) return 'Strong';
  if(b >= 6) return 'Confident';
  if(b >= 4.5) return 'Steady';
  if(b >= 3) return 'Building';
  return 'Getting started';
}

/* Main evaluator.
   target = expected sentence (or '' for free speech) */
function evaluate(target, transcript, durationSec, opts){
  opts = opts || {};
  const raw = String(transcript||'');
  const saidW = words(raw);
  const saidN = saidW.map(norm).filter(Boolean);
  const dur = Math.max(1, durationSec || 1);
  const wpm = saidN.length / (dur/60);

  let accuracy = null, missing = [];
  if(target){
    const tW = words(target);
    const tN = tW.map(norm).filter(Boolean);
    const { len, matchedTarget } = lcsMatch(tN, saidN);
    accuracy = tN.length ? len / tN.length : 0;
    tW.forEach((w,i)=>{ if(!matchedTarget[i]) missing.push(w); });
  }

  const fillers = countFillers(raw);
  const g = checkGrammar(raw);

  const fluency = fluencyScore(wpm, fillers, saidN.length);
  const vocab = vocabScore(saidN);
  const grammar = grammarScore(g.hits, saidN.length);
  const clarity = accuracy === null ? clamp(4 + Math.min(6, saidN.length/8), 0, 10) : accuracy * 10;
  const structure = structureScore(raw);

  let band;
  if(opts.story){
    band = clarity*0.15 + fluency*0.25 + grammar*0.20 + vocab*0.15 + structure*0.25;
  }else if(accuracy === null){
    band = fluency*0.35 + grammar*0.30 + vocab*0.25 + clarity*0.10;
  }else{
    band = clarity*0.40 + fluency*0.25 + grammar*0.20 + vocab*0.15;
  }
  band = Math.round(clamp(band,0,10)*10)/10;

  return {
    band, label: bandLabel(band),
    accuracy: accuracy === null ? null : Math.round(accuracy*100),
    clarity: Math.round(clarity*10)/10,
    fluency: Math.round(fluency*10)/10,
    grammar: Math.round(grammar*10)/10,
    vocab: Math.round(vocab*10)/10,
    structure: Math.round(structure*10)/10,
    wpm: Math.round(wpm),
    fillers,
    wordCount: saidN.length,
    missing,
    grammarFixes: g.hits,
    story: !!opts.story,
    stages: storyStages(raw),
    transcript: raw
  };
}

function speedNote(wpm){
  if(wpm < 70) return 'Too slow — try speaking in longer groups of words.';
  if(wpm < 95) return 'A little slow. Aim for about 120 words per minute.';
  if(wpm <= 165) return 'Good speed. Natural and easy to follow.';
  if(wpm <= 195) return 'A bit fast — this is the rushing habit. Slow down.';
  return 'Too fast. Pause between sentences.';
}

/* ---- voice commands, said alone (hands-free) ---- */
const CMD = new Map(Object.entries({ stop:'stop', cancel:'stop', quit:'stop', repeat:'repeat', again:'repeat', next:'skip', skip:'skip', slower:'slow', slow:'slow' }));
function cmdOf(said){ return CMD.get(String(said||'').toLowerCase().replace(/[^a-z ]/g,'').trim()) || null; }

/* What a driver hears after each answer: short, no screen needed. */
function spokenFeedback(r){
  let s = `Score ${r.band.toFixed(1)}. `;
  s += r.wpm > 165 ? 'You spoke fast. Slow down.' : r.wpm && r.wpm < 85 ? 'A little slow. Join your words.' : 'Good speed.';
  if(r.story){
    const miss = r.stages.filter(x => !x[1]).map(x => x[0]);
    if(miss.length) s += ` Your story missed: ${miss.join(', ')}.`;
  } else if(r.missing.length) s += ` Practice these words: ${r.missing.slice(0,3).join(', ')}.`;
  else if(r.grammarFixes.length) s += ` Better: ${r.grammarFixes[0].fix}.`;
  return s;
}

/* ---- weekly check-up: the same 3 steps every time. Only this sets the rating. ---- */
const SKILLS = [['Clarity','clarity'],['Fluency','fluency'],['Grammar','grammar'],['Vocabulary','vocab'],['Story structure','structure']];
const r1 = v => Math.round(v*10)/10;
function recordCheckup(out){            // out = [repeat step, question step, story step]
  const [a,b,c] = out;
  const rec = {
    t: Date.now(),
    band: r1(avg(out.map(x=>x.band))),
    clarity: a.clarity,                              // how many words of a known sentence were heard
    fluency: r1(avg(out.map(x=>x.fluency))),
    grammar: r1(avg([b.grammar, c.grammar])),
    vocab: r1(avg([b.vocab, c.vocab])),
    structure: c.structure,
    wpm: Math.round(avg([b.wpm, c.wpm]))
  };
  S.checkups.push(rec);
  S.checkups = S.checkups.slice(-52);
  bumpStreak(); save(); renderHud();
  return rec;
}

function checkupCard(){
  const C = S.checkups || [];
  if(!C.length){
    return `<div class="card"><h3>Speaking check-up</h3>
      <div class="muted" style="margin-bottom:12px">Your real rating. Take the same 3-minute test every week, in a quiet place, and compare. Practice does not change it, so the number only moves when your speaking does.</div>
      <button class="act primary" onclick="startCheckup()">Take my first check-up</button></div>`;
  }
  const f = C[0], l = C[C.length-1];
  const d = l.band - f.band;
  const days = Math.floor((Date.now() - l.t) / 864e5);
  const color = l.band >= 7 ? 'good' : l.band >= 5 ? 'warn' : 'bad';
  const tint = dv => dv >= 0.1 ? 'var(--good)' : dv <= -0.1 ? 'var(--bad)' : 'var(--dim)';
  const rows = SKILLS.map(([name,k]) => {
    const dv = l[k] - f[k];
    return `<div class="hist"><span>${name}</span><span>${f[k].toFixed(1)} → <b>${l[k].toFixed(1)}</b> <span style="color:${tint(dv)}">${dv>=0?'+':''}${dv.toFixed(1)}</span></span></div>`;
  }).join('');
  return `<div class="card"><h3>Speaking check-up</h3>
    ${scoreHead(l.band, bandLabel(l.band))}
    <div class="muted">${C.length === 1 ? 'This is your starting point.' : `Since your first check-up: <b style="color:${tint(d)}">${d>=0?'+':''}${d.toFixed(1)}</b>`}. ${C.length} check-up${C.length===1?'':'s'} so far.</div>
    <div class="muted" style="margin-top:4px">History: ${C.slice(-6).map(x=>x.band.toFixed(1)).join(' → ')}</div>
    <div style="margin:10px 0">${rows}<div class="hist"><span>Speed (aim 110–150)</span><span>${f.wpm} → <b>${l.wpm}</b> words/min</span></div></div>
    <div class="tip ${days>=7?'good':''}">${days>=7 ? 'Your weekly check-up is due.' : `Next check-up in ${7-days} day${7-days===1?'':'s'}.`}</div>
    <button class="act primary" style="margin-top:10px" onclick="startCheckup()">Take check-up</button></div>`;
}

function saveSession(mode, topic, r){
  S.history.push({
    t: Date.now(), mode, topic,
    band: r.band, clarity: r.clarity, fluency: r.fluency,
    grammar: r.grammar, vocab: r.vocab, structure: r.structure,
    wpm: r.wpm, fillers: r.fillers, words: r.wordCount
  });
  if(S.history.length > 400) S.history = S.history.slice(-400);
  S.xp += Math.round(r.band * 2) + 5;
  bumpStreak();
  save(); renderHud();
}

/* ============================================================
   4. SPEECH: speak / listen / beep / wakelock
   ============================================================ */
let chosenVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    if(!vs.length) return;
    chosenVoice =
      vs.find(v => /en-US/i.test(v.lang) && /samantha|ava|allison|serena/i.test(v.name)) ||
      vs.find(v => /en-US/i.test(v.lang)) ||
      vs.find(v => /^en/i.test(v.lang)) || null;
  }catch(e){}
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text, rateOverride){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window) || !text){ resolve(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rateOverride || S.settings.rate;
    u.pitch = 1;
    if(chosenVoice) u.voice = chosenVoice;
    let done = false;
    const finish = ()=>{ if(done) return; done = true; clearTimeout(guard); resolve(); };
    // safety net: iOS sometimes never fires onend
    const est = Math.max(1200, text.length * 68 / (u.rate || 1));
    const guard = setTimeout(finish, est + 2500);
    u.onend = finish;
    u.onerror = finish;
    try{ speechSynthesis.speak(u); }catch(e){ finish(); }
  });
}
function stopSpeaking(){ try{ speechSynthesis.cancel(); }catch(e){} }

const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_OK = !!SRClass;

/* Listen until silence, max time, or stop. */
let stopListen = null;
function listen(opts){
  opts = opts || {};
  const maxMs = opts.maxMs || 20000;
  const silenceMs = opts.silenceMs || (S.settings.silence * 1000);
  const onInterim = opts.onInterim || function(){};

  return new Promise(resolve=>{
    if(!SR_OK){ resolve({ ok:false, transcript:'', durationSec:0 }); return; }

    const rec = new SRClass();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    let finalText = '', interimText = '', done = false, firstAt = 0, lastAt = 0;
    const started = Date.now();
    let silenceTimer = null, maxTimer = null;

    function finish(ok){
      if(done) return;
      done = true;
      stopListen = null;
      clearTimeout(silenceTimer); clearTimeout(maxTimer);
      try{ rec.abort(); }catch(e){}
      const text = (finalText + ' ' + interimText).replace(/\s+/g,' ').trim();
      // time from first to last heard word, so the silence wait is not counted as slow speech
      // shortcut: about +-10% (recognition lag); fine for tracking change, not exact speed
      const spoke = lastAt > firstAt ? (lastAt-firstAt)/1000 : (Date.now()-started)/1000 - silenceMs/1000;
      resolve({ ok, transcript: text, durationSec: Math.max(1, spoke) });
    }
    function resetSilence(){
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(()=>finish(true), silenceMs);
    }

    stopListen = ()=>finish(true);
    maxTimer = setTimeout(()=>finish(true), maxMs);

    rec.onresult = (e)=>{
      interimText = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal) finalText += ' ' + r[0].transcript;
        else interimText += ' ' + r[0].transcript;
      }
      lastAt = Date.now(); if(!firstAt) firstAt = lastAt;
      onInterim((finalText + ' ' + interimText).trim());
      resetSilence();
    };
    rec.onerror = (e)=>{
      if(e.error === 'no-speech' || e.error === 'aborted') return;
      finish(true);
    };
    rec.onend = ()=>{
      if(done) return;
      if(Date.now() - started < maxMs - 600){
        try{ rec.start(); return; }catch(e){}
      }
      finish(true);
    };

    try{ rec.start(); }catch(e){ resolve({ok:false,transcript:'',durationSec:0}); return; }
    resetSilence();
  });
}

let actx = null;
function beep(freq, dur){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq || 700;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.12));
    o.start(); o.stop(actx.currentTime + (dur||0.12) + 0.03);
  }catch(e){}
}

let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }else if(!on && wakeLock){
      wakeLock.release(); wakeLock = null;
    }
  }catch(e){}
}

const ic = n => IC[n] || '';
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toneOf = b => b >= 7 ? 'good' : b >= 5 ? 'warn' : 'bad';

function scoreHead(band, label){
  return `<div class="scorehead"><div class="ring" data-tone="${toneOf(band)}" style="--v:${Math.round(band*10)}" role="img" aria-label="${band.toFixed(1)} out of 10"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="trk" cx="18" cy="18" r="15.9155"/><circle class="val" cx="18" cy="18" r="15.9155" pathLength="100"/></svg><b>${band.toFixed(1)}</b></div><div><div class="lbl">${label}</div><div class="muted">out of 10</div></div></div>`;
}

/* Speed on a line from 0 to 220 words a minute. The shaded part is the 110 to 150 target. */
function paceMeter(wpm){
  if(!wpm) return '';
  const p = clamp(wpm / 220 * 100, 0, 100);
  const tone = (wpm >= 95 && wpm <= 165) ? 'good' : 'warn';
  return `<div class="pace" data-tone="${tone}"><div class="paceTrack"><i class="zone"></i><b class="pin" style="--p:${p}%"></b></div><div class="paceLegend"><span>Slow</span><span>Target 110 to 150</span><span>Fast</span></div><div class="muted"><b>${wpm}</b> words per minute. ${speedNote(wpm)}</div></div>`;
}

/* In-page dialog. The phone's own alert, confirm and prompt are blocked in many viewers,
   which made buttons look dead. onOk runs inside the tap, so audio can still start. */
function sheet(msg, okLabel, onOk, opts){
  opts = opts || {};
  const inp = $('sheetIn');
  $('sheetMsg').textContent = msg;
  inp.hidden = !opts.input; inp.value = '';
  $('sheetOk').textContent = okLabel || 'OK';
  $('sheetNo').hidden = !onOk;
  $('sheet').hidden = false;
  const close = ()=>{ $('sheet').hidden = true; };
  $('sheetOk').onclick = ()=>{ close(); if(onOk) onOk(inp.value.trim()); };
  $('sheetNo').onclick = close;
  document.querySelector('#sheet .scrim').onclick = close;
  try{ (opts.input ? inp : $('sheetOk')).focus(); }catch(e){}
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && !$('sheet').hidden) $('sheetNo').click(); });

const TABS = ['lessons','story','chat','progress'];
function switchTab(name){
  document.querySelectorAll('nav button').forEach(b=>{
    const on = b.dataset.tab === name;
    b.classList.toggle('active', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('tabs').style.setProperty('--i', TABS.indexOf(name));
  TABS.forEach(t=>{ $('tab-'+t).hidden = (t !== name); });
  $('hfToggle').hidden = name !== 'lessons';
  const sec = $('tab-'+name);
  sec.classList.remove('enter'); void sec.offsetWidth; sec.classList.add('enter');
  if(name === 'progress') renderProgress();
  try{ window.scrollTo(0, 0); }catch(e){}
}
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

function showLessonFeedback(host, target, r){
  if(L.savedText !== r.transcript){ saveSession('lesson', L.topicId, r); L.savedText = r.transcript; }

  let html = `

}

/* ============================================================
   8. HANDS-FREE ENGINE
   One voice-driven runner for drive sessions, chats and the check-up.
   Voice commands (said alone): repeat, next, slower, stop.
   ============================================================ */
const HF = { running:false, cancelled:false };

function hfToggleUI(){ $('hf').classList.toggle('on', HF.running); }

function setHf(status, main, heard, score){
  if(status !== undefined){ $('hfStatus').textContent = status; $('hf').classList.toggle('listening', status === 'Listening'); }
  if(main !== undefined) $('hfText').innerHTML = main;
  if(heard !== undefined) $('hfHeard').textContent = heard;
  if(score !== undefined) $('hfScore').innerHTML = score;
}

function hfCancel(){
  HF.cancelled = true;
  stopSpeaking();
  if(stopListen) stopListen();
}
$('hfStop').onclick = hfCancel;
// a web page pauses when the phone locks or you switch app: end the session cleanly instead
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && HF.running) hfCancel(); });

/* The same 3 steps every time, so results can be compared week to week. */
const CHECKUP = [
  { target:'I usually wake up early, and then I walk to work because it helps me think clearly.' },
  { say:'Tell me about your job or your studies, and what you like about it.', ms:45000, silence:3200 },
  { say:'Tell the story of a day when something went wrong. What happened, what did you do, and how did it end? Speak for about one minute.', story:true, ms:90000, silence:4000 }
];

async function finishCheckup(out){
  if(CHECKUP.some((_, i) => !out[i])){
    setHf('Not saved', 'Check-up not finished', '', '');
    await speak('The check-up was not finished, so it was not saved.');
    return;
  }
  const prev = S.checkups[S.checkups.length - 1];
  const rec = recordCheckup(out);
  setHf('Check-up result', `${rec.band.toFixed(1)} / 10`, bandLabel(rec.band), '');
  await speak(`Check-up done. Your rating is ${rec.band.toFixed(1)} out of 10, ${bandLabel(rec.band)}.` +
              (prev ? ` Last time it was ${prev.band.toFixed(1)}.` : ' This is your starting point.'));
}

/* steps: { target } = repeat this sentence, { say } = answer this question (story:true = tell a story).
   Returns the results by step (a skipped step is empty); .cancelled is true if you stopped it. */
async function hfRun(steps, name, opts){
  opts = opts || {};
  if(!SR_OK){ sheet('This browser has no speech input. Open the app in Safari.'); return null; }
  if(HF.running) return null;
  HF.running = true; HF.cancelled = false;
  // audio and the first words must start inside the tap, or iPhone blocks them
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){}
  const intro = opts.intro ? speak(opts.intro, 0.9) : null;
  hfToggleUI();
  await keepAwake(true);
  setHf('Starting', 'Get ready', '', '');
  const out = [];
  let rate = 0.9;
  try{
    if(intro) await intro;
    for(let i = 0; i < steps.length && !HF.cancelled; i++){
      const st = steps[i];
      let best = null, tries = 0, silent = 0;
      while(!HF.cancelled && tries < 2){
        setHf(`Step ${i+1} of ${steps.length}`, st.target || st.say, '', '');
        if(st.target){ await speak('Listen.', rate); await speak(st.target, rate); await speak('Now you say it.', rate); }
        else await speak(st.say + ' Now answer.', rate);
        if(HF.cancelled) break;
        beep(760, 0.09);
        setHf('Listening', undefined, 'Speak now…', '');
        const r = await listen({ maxMs: st.ms || 22000, silenceMs: st.silence || 2600, onInterim: t => setHf(undefined, undefined, t, undefined) });
        if(HF.cancelled) break;
        const said = r.transcript.trim();
        const c = cmdOf(said);
        if(c === 'stop'){ HF.cancelled = true; break; }
        if(c === 'skip') break;
        if(c === 'slow'){ rate = 0.72; continue; }
        if(c === 'repeat') continue;
        if(!words(said).length){                 // road noise or silence: never score it
          if(++silent >= 2){ await speak('Skipping.'); break; }
          await speak('I did not hear you.'); continue;
        }
        const res = evaluate(st.target || '', said, r.durationSec, { story: st.story });
        if(!best || res.band > best.band) best = res;
        setHf('Result', st.target || st.say, said, `${res.band.toFixed(1)}<div class="hfLabel">${res.label}</div>`);
        tries++;
        if(st.target && !opts.checkup && res.accuracy < 80 && tries < 2){
          rate = Math.min(rate, 0.8);
          await speak('Let us try that once more.', rate);
          continue;
        }
        break;
      }
      if(best){
        out[i] = best;
        if(!opts.checkup){ saveSession(opts.mode || 'lesson', name, best); await speak(spokenFeedback(best), 0.9); }
      }
    }
    if(!HF.cancelled){
      if(opts.checkup) await finishCheckup(out);
      else {
        const d = out.filter(Boolean);
        if(d.length){
          const m = avg(d.map(x => x.band));
          setHf('Session complete', `Average ${m.toFixed(1)} / 10`, bandLabel(m), '');
          await speak(`Session complete. Your average is ${m.toFixed(1)} out of 10. ${bandLabel(m)}.`, 0.9);
        }
      }
    }
  } finally {
    HF.running = false; hfToggleUI(); await keepAwake(false);
  }
  out.cancelled = HF.cancelled;
  return out;
}

function startCheckup(){
  if(HF.running) return;
  sheet('Do the check-up in a quiet place, not while driving. It takes about 3 minutes and uses the same questions every time.', 'Start check-up', ()=>{
    hfRun(CHECKUP, 'Check-up', { checkup:true, intro:'Speaking check-up. Say stop at any time.' }).then(()=>{ renderProgress(); });
  });
}

/* Drive session: 4 sentences from your chosen lesson, 2 questions, 1 story. Rotates each time. */
function startDrive(){
  if(HF.running) return;
  sheet('Start while parked, with the phone in a mount and the screen on. Do not touch the screen while driving. Say "stop" to end.', 'Start session', ()=>{
    const n = S.driveN || 0;
    const t = CHAT_TOPICS[CH.idx], p = STORY_PROMPTS[n % STORY_PROMPTS.length];
    const steps = [
      ...topicItems().map(i => ({ target:i.t })),
      ...[0,1].map(k => ({ say:t.qs[(n + k) % t.qs.length], ms:45000, silence:3200 })),
      { say:p.prompt + ' Speak for about one minute.', story:true, ms:90000, silence:4000 }
    ];
    hfRun(steps, 'Drive', { intro:'Drive session. Say repeat, next, slower or stop at any time.' }).then(out=>{
      if(out && !out.cancelled){ S.driveN = n + 1; save(); }
      renderLessons(); renderProgress();
    });
  });
}
$('hfToggle').onclick = startDrive;

function storyFeedbackHTML(r){
  const color = r.band >= 7 ? 'good' : r.band >= 5 ? 'warn' : 'bad';
  return `
    <div style="margin-top:16px">
      ${scoreHead(r.band, r.label)}
      ${skillBar('Story structure', r.structure)}
      ${skillBar('Fluency', r.fluency)}
      ${skillBar('Grammar', r.grammar)}
      ${skillBar('Vocabulary', r.vocab)}
      ${skillBar('Clarity / length', r.clarity)}
      ${r.story ? `<div class="chips" style="margin:6px 0 12px">${r.stages.map(([n,ok])=>`<span class="chip ${ok?'active':''}">${ok?'✓':'✗'} ${n}</span>`).join('')}</div>` : ''}
      ${paceMeter(r.wpm)}<div class="muted">${r.wordCount} words, ${r.fillers} filler sound${r.fillers===1?'':'s'}</div>
      ${r.grammarFixes.length ? r.grammarFixes.slice(0,4).map(f=>`<div class="tip bad">Better: <b>${f.fix}</b></div>`).join('') : '<div class="tip good">No common grammar mistakes found.</div>'}
      ${r.structure < 6 ? '<div class="tip">Add linking words: <b>first, then, after that, because, finally</b>. They make a story easy to follow.</div>' : '<div class="tip good">Your story had a clear structure. Well done.</div>'}
      ${r.wordCount < 50 ? '<div class="tip">Your story was short. Aim for 80–120 words — about one minute of speaking.</div>' : ''}
    </div>`;
}

function skillBar(name, val){
  const color = val >= 7 ? 'good' : val >= 5 ? 'warn' : 'bad';
  return `<div class="skill">
    <div class="lab"><span>${name}</span><b>${val.toFixed(1)}</b></div>
    <div class="bar"><i class="${color}" style="width:${val*10}%"></i></div>

}

function renderProgressBody(){
  const sec = $('tab-progress');
  const h = S.history || [];

  if(!h.length){
    sec.innerHTML = `<div class="card"><h3>Progress</h3>
      <div class="muted">No practice yet. Finish a lesson, story, chat or drive session and your scores will appear here.</div>
    </div>`;
    return;
  }

  const last = h[h.length-1];
  const best = Math.max(...h.map(x=>x.band));
  const firstAvg = avg(h.slice(0, Math.min(5,h.length)).map(x=>x.band));
  const lastAvg = avg(h.slice(-Math.min(5,h.length)).map(x=>x.band));
  const delta = lastAvg - firstAvg;

  const skillAvg = k => avg(h.slice(-20).map(x=>x[k]).filter(v=>typeof v==='number'));

  sec.innerHTML = `
    <div class="card">
      <h3>Latest practice score</h3>
      ${scoreHead(last.band, bandLabel(last.band))}
      <div class="muted">
        Best: <b>${best.toFixed(1)}</b> ·
        Sessions: <b>${h.length}</b> ·
        Streak: <b>${S.streak}</b> days ·
        XP: <b>${S.xp}</b>
      </div>
      <div class="tip ${delta >= 0.3 ? 'good' : delta <= -0.3 ? 'bad' : ''}">
        ${delta >= 0.3
          ? `You improved <b>+${delta.toFixed(1)}</b> points compared to when you started. Keep going.`
          : delta <= -0.3
          ? `You are <b>${delta.toFixed(1)}</b> below your starting average. Slow down and use shorter sentences.`
          : `Your average is steady (<b>${delta >= 0 ? '+' : ''}${delta.toFixed(1)}</b>). To grow, add one new word to every answer.`}
      </div>
    </div>

    <div class="card">
      <h3>Rating over time</h3>
      <canvas id="chart"></canvas>
      <div class="muted" style="margin-top:8px">Each point is one session. The line is your 0–10 speaking band.</div>
    </div>

    <div class="card">
      <h3>Skill averages (last 20 sessions)</h3>
      ${skillBar('Clarity (words heard correctly)', skillAvg('clarity'))}
      ${skillBar('Fluency (speed + fillers)', skillAvg('fluency'))}
      ${skillBar('Grammar', skillAvg('grammar'))}
      ${skillBar('Vocabulary', skillAvg('vocab'))}
      ${skillAvg('structure') ? skillBar('Story structure', skillAvg('structure')) : ''}
      <div class="muted">Average speed: <b>${Math.round(avg(h.slice(-10).map(x=>x.wpm||0)))}</b> words/min · Target: 110–150</div>
    </div>

    <div class="card">
      <h3>Last 10 sessions</h3>
      ${h.slice(-10).reverse().map(x=>`
        <div class="hist">
          <div>
            <div>${new Date(x.t).toLocaleDateString()} · ${x.mode}</div>
            <div class="muted" style="font-size:12px">${x.topic||''}</div>
          </div>
          <div class="b" style="color:${x.band>=7?'var(--good)':x.band>=5?'var(--warn)':'var(--bad)'}">${x.band.toFixed(1)}</div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>Data</h3>
      <button class="act" id="btnExport">${ic('down')}Save a backup of my progress</button>
      <button class="act ghost danger" id="btnReset">Reset all progress</button>
    </div>
  `;

  drawChart($('chart'), h.map(x=>x.band));

  $('btnExport').onclick = ()=>{
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'speak-daily-progress.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  };
  $('btnReset').onclick = ()=> sheet('Delete all progress? This cannot be undone.', 'Delete', ()=>{ S = fresh(); save(); renderHud(); renderProgress(); });
}

function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }

function drawChart(canvas, values){
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 320;
  const hgt = 150;
  canvas.width = w * dpr;
  canvas.height = hgt * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,hgt);

  // grid
  ctx.strokeStyle = cv('--line');
  ctx.lineWidth = 1;
  ctx.fillStyle = cv('--ink-2');
  ctx.font = '10px -apple-system, sans-serif';
  for(let v=0; v<=10; v+=5){
    const y = hgt - 10 - (v/10)*(hgt-24);
    ctx.beginPath(); ctx.moveTo(26, y); ctx.lineTo(w-4, y); ctx.stroke();
    ctx.fillText(String(v), 4, y+3);
  }

  const n = values.length;
  const x = i => n === 1 ? (26 + (w-30)/2) : 26 + (i/(n-1)) * (w-30);
  const y = v => hgt - 10 - (clamp(v,0,10)/10) * (hgt-24);

  // line
  ctx.strokeStyle = cv('--sign');
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  values.forEach((v,i)=>{ i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)); });
  ctx.stroke();

  // dots
  values.forEach((v,i)=>{
    ctx.beginPath();
    ctx.arc(x(i), y(v), n > 30 ? 1.8 : 3, 0, Math.PI*2);
    ctx.fillStyle = v >= 7 ? cv('--good') : v >= 5 ? cv('--warn') : cv('--bad');
    ctx.fill();
  });
}

/* ============================================================
   12. INIT
   ============================================================ */
renderHud();
renderLessons();
renderStory();
renderChat();
renderProgress();

// clean up when leaving
window.addEventListener('beforeunload', ()=>{ stopSpeaking(); });

// re-render chart on resize / rotate
window.addEventListener('resize', ()=>{
  if(!$('tab-progress').hidden && S.history.length){
    drawChart($('chart'), S.history.map(x=>x.band));
  }
});
</script>
